<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Авторизация. Платформа Цифрового Рубля</title>
  <link href="styles.css" rel="stylesheet"/>
  <link href="auth.css" rel="stylesheet"/>
  <script src='script.js'></script>
</head>
<body>
    <div class="App">
        <header class="request-header">
            <div class="request-wrapper-global" bis_skin_checked="1">
                <div class="request-header__row" bis_skin_checked="1">
                    <a href="https://www.centrinvest.ru" title="ПАО КБ «Центр-инвест»">
                        <img class="request-header__logo-img" src="assets/logo.svg"/>
                    </a>
                    <div class="request-header__links" bis_skin_checked="1">
                        <a href="https://www.centrinvest.ru/about/contacts" class="request-header__header-link" title="Вернуться на сайт ПАО КБ «Центр-инвест»">Вернуться на сайт банка</a>
                    </div>
                </div>
            </div>
        </header>
    <section id="auth" class="authorization-section">
        <div class="authorization-container">
          <div class="authorization-card">
            <h2 class="authorization-title">Войти в аккаунт</h2>
  
            <form class="authorization-form" id="loginForm">
              <div class="input-group">
                <label>Электронная почта</label>
                <input
                    id="userEmail"
                    type="email"
                    name="userEmail"
                    placeholder="IvanZapara04@mail.ru"
                    required
                />
              </div>
  
              <div class="input-group">
                <label>Пароль</label>
                <input
                    id="password"
                    type="password" 
                    name="password"
                  required 
                />
              </div>
  
              <div class="authorization-footer">
                <button type="submit" class="action-button">
                    <span class="button-text">Войти</span>
                </button>
              </div>
            </form>
            <p class="login-prompt">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
              </p>
          </div>
        </div>
      </section>
      </div>
    </body>
</html>
